name: Clean Recovered Inbox Wiring

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Safely merge recovered notification logic into existing frontend
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('artifacts/yuniko-app/src/App.tsx')
          text = p.read_text()
          text = text.replace('import { MessagesPage, NotificationsPage } from "./socialInbox";\n', '')
          text = re.sub(r'function LocalMessagesRoute\(\) \{.*?\n\}\nfunction LocalNotificationsRoute\(\) \{.*?\n\}\n\n', '', text, count=1, flags=re.S)
          text = re.sub(r'\s*<Route path="/messages"><LocalMessagesRoute /></Route>\n\s*<Route path="/notifications"><LocalNotificationsRoute /></Route>\n\s*', ' ', text, count=1)
          if 'type LocalYunikoNotification' not in text:
              marker = 'function Notifications() {'
              if marker not in text: raise SystemExit('Notifications component anchor missing; stopping safely.')
              type_def = '''type LocalYunikoNotification = {\n  id: string;\n  type: "like" | "follow" | "story";\n  actorId: string;\n  read: boolean;\n  createdAt: number;\n};\n\n'''
              text = text.replace(marker, type_def + marker, 1)
          start = text.find('function Notifications() {')
          end = text.find('\nfunction Messages() {', start)
          if start < 0 or end < 0:
              raise SystemExit('Could not safely locate Notifications component boundaries.')
          new_fn = '''function Notifications() {\n  const [, navigate] = useLocation();\n  const { state, toggleFollow, showToast } = useDemo();\n  const defaults: LocalYunikoNotification[] = [\n    { id: "like-p1", type: "like", actorId: "2", read: false, createdAt: Date.now() - 2 * 60 * 1000 },\n    { id: "follow-3", type: "follow", actorId: "3", read: false, createdAt: Date.now() - 60 * 60 * 1000 },\n    { id: "story-s1", type: "story", actorId: "1", read: true, createdAt: Date.now() - 3 * 60 * 60 * 1000 },\n  ];\n  const [items, setItems] = useState<LocalYunikoNotification[]>(() => {\n    try {\n      const saved = localStorage.getItem("yuniko-notifications-v1");\n      return saved ? JSON.parse(saved) : defaults;\n    } catch {\n      return defaults;\n    }\n  });\n  useEffect(() => {\n    try { localStorage.setItem("yuniko-notifications-v1", JSON.stringify(items)); } catch {}\n  }, [items]);\n  const unread = items.filter((item) => !item.read).length;\n  const markAllRead = () => setItems((current) => current.map((item) => ({ ...item, read: true })));\n  const actor = (id: string) => people.find((person) => person.id === id) ?? people[1];\n  const ago = (value: number) => { const minutes = Math.max(0, Math.floor((Date.now() - value) / 60000)); return minutes < 60 ? `${minutes}m` : `${Math.floor(minutes / 60)}h`; };\n  return <PageShell><TopBar title="Notifications" back={false} action={unread > 0 ? <button onClick={markAllRead} className="text-xs text-pink-400">Mark all read</button> : undefined} /><div className="px-4 pt-2">{items.map((item) => { const user = actor(item.actorId); const common = <><Avatar user={user} size="md" ring /><p className="text-sm text-white/80 flex-1"><b>{user.displayName}</b>{" "}{item.type === "like" ? "liked your post" : item.type === "follow" ? "started following you" : "mentioned you in a story"}<span className="text-white/40"> · {ago(item.createdAt)}</span></p></>; return item.type === "like" ? <button key={item.id} onClick={() => { setItems((current) => current.map((n) => n.id === item.id ? { ...n, read: true } : n)); navigate("/post/p1"); }} className={`w-full flex items-center gap-3 py-4 border-b border-white/5 text-left ${item.read ? "opacity-70" : ""}`}>{common}<img src={IMG.flower} alt="" className="w-12 h-12 rounded-lg object-cover" /></button> : item.type === "follow" ? <div key={item.id} className={`flex items-center gap-3 py-4 border-b border-white/5 ${item.read ? "opacity-70" : ""}`}>{common}<button onClick={() => { setItems((current) => current.map((n) => n.id === item.id ? { ...n, read: true } : n)); toggleFollow("3"); showToast(state.following.includes("3") ? "Unfollowed Lina Rose" : "Following Lina Rose"); }} className="px-3 py-1.5 rounded-full text-xs font-semibold" style={{ background: state.following.includes("3") ? "rgba(255,255,255,.12)" : GRADIENT }}>{state.following.includes("3") ? "Following" : "Follow back"}</button></div> : <button key={item.id} onClick={() => { setItems((current) => current.map((n) => n.id === item.id ? { ...n, read: true } : n)); navigate("/story/s1"); }} className={`w-full flex items-center gap-3 py-4 border-b border-white/5 text-left ${item.read ? "opacity-70" : ""}`}>{common}<Play size={18} className="text-pink-400" /></button>; })}</div>{!items.length && <EmptyState icon={<Bell size={28} />} title="No notifications" body="New interactions will appear here." />}</PageShell>;\n}\n'''
          text = text[:start] + new_fn + text[end:]
          p.write_text(text)

      - name: Remove redundant module
        shell: bash
        run: |
          rm -f artifacts/yuniko-app/src/socialInbox.tsx

      - name: Build Yuniko
        run: |
          corepack enable
          corepack prepare pnpm@10.11.1 --activate
          pnpm install --frozen-lockfile
          pnpm --filter @workspace/yuniko-app run build

      - name: Commit only after build passes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/yuniko-app/src/App.tsx
          git add -u artifacts/yuniko-app/src/socialInbox.tsx
          git diff --cached --quiet && exit 0
          git commit -m "feat: recover local notification logic without backend"
          git push
