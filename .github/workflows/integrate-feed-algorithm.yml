name: Integrate Feed Algorithm

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Integrate ranking into Home
        shell: python
        run: |
          from pathlib import Path
          path = Path('artifacts/yuniko-app/src/App.tsx')
          text = path.read_text()
          if 'import { rankFeedPosts } from "./feedAlgorithm";' not in text:
              text = text.replace('import "./index.css";\n', 'import "./index.css";\nimport { rankFeedPosts } from "./feedAlgorithm";\n', 1)
          if 'const rankedPosts = useMemo(() =>' not in text:
              raise SystemExit('Feed ranking is missing; use the existing ranking integration workflow.')
          if '{rankedPosts.map((post) =>' not in text:
              raise SystemExit('Ranked feed render is missing.')
          path.write_text(text)
          print('Feed ranking verified.')

      - name: Verify manual Home refresh and new-post badge
        shell: python
        run: |
          from pathlib import Path
          text = Path('artifacts/yuniko-app/src/App.tsx').read_text()
          required = ['yuniko-feed-seen-at', 'newPostCount', 'yuniko:refresh-feed', 'Math.min(newPostCount, 15)']
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit('Missing refresh/badge logic: ' + ', '.join(missing))
          print('Manual Home refresh and 15+ badge verified.')

      - name: Freeze feed until manual Home refresh
        shell: python
        run: |
          from pathlib import Path
          path = Path('artifacts/yuniko-app/src/App.tsx')
          text = path.read_text()
          old = '  }, [state.posts, state.following, state.liked, state.saved, state.comments, state.blocked, feedCycle]);'
          new = '  }, [feedCycle]);'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('Feed ranking dependency line not found.')
          path.write_text(text)
          print('Feed order is frozen until a manual Home refresh.')

      - name: Build Yuniko
        run: |
          corepack enable
          corepack prepare pnpm@10.11.1 --activate
          pnpm install --frozen-lockfile
          pnpm --filter @workspace/yuniko-app run build

      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/yuniko-app/src/App.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix: freeze feed until manual Home refresh"
          git push
