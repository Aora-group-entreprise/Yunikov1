name: Deploy Yuniko to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm

      # The repository must contain a lockfile matching every workspace
      # package before Cloudflare's frozen install is allowed to run.
      - name: Synchronize workspace lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Commit synchronized lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "pnpm-lock.yaml is already synchronized."
          else
            git add pnpm-lock.yaml
            git commit -m "chore(ci): synchronize pnpm lockfile"
            git push
          fi

      # Verify the exact install mode used by the deployment environment.
      - name: Install dependencies (frozen)
        run: pnpm install --frozen-lockfile

      - name: Build Yuniko
        run: pnpm --filter @workspace/yuniko-app run build

      - name: Deploy to Cloudflare
        run: npx wrangler deploy --config wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
